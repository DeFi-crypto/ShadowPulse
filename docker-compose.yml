services:
  backend:
    build:
      context: ./backend
    image: shadowpulse-backend:latest
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      USE_LIVE_DATA: ${USE_LIVE_DATA:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-ShadowPulse Research research@shadowpulse.io}
    expose:
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    image: shadowpulse-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
